name = "filecodebox-cf"
main = "src/worker.js"
compatibility_date = "2026-10-24"
# 变量由控制台管理，CLI 更新代码时保留已有变量。
keep_vars = true

# 静态前端（SPA）：/public 下的 index.html / styles.css / app.js
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 页面安全响应头和 /file 下载鉴权必须经过 Worker，不能由 SPA 回退抢先处理。
run_worker_first = true

[[d1_databases]]
binding = "fcb_db"
database_name = "filecodebox"
database_id = "f08cde61-a39d-4a56-8cf8-346db7d71a46"

# ===== D1 已通过 CLI 绑定；所有密钥仍通过 Secret 配置，不写入此文件 =====
# 部署后请在面板做两件事：
# 1) 部署到其他账号时，替换上方 database_id，或在控制台重新绑定 fcb_db；
#    表结构会在首次访问时自动创建（幂等）；migrations/ 也提供离线迁移。
# 2) 设置变量（Worker → Settings → Variables and Secrets）：
#    TG_BOT_TOKEN + TG_CHAT_ID  Telegram 存储；或 IMG_BED_URL 使用已部署的 ImgBed
#    ADMIN_API_TOKEN 必需（Secret），仅用于首次绑定 Passkey，绑定后不再授权
#    ADMIN_ORIGIN    必需，稳定的 HTTPS 前端 origin（不带末尾斜杠）
#    ADMIN_KEY       旧变量，仅保留文件令牌兼容，不再用于管理登录
#    FILE_SECRET     强烈建议（Secret），文件/上传/分片 token 的 HMAC 密钥
#    APP_NAME / APP_SUBTITLE  可选，界面展示文案（不填则用内置默认值）
#    IMG_BED_UPLOAD_TOKEN / IMG_BED_UPLOAD_TOKEN_PARAM / IMG_BED_UPLOAD_CHANNEL / IMG_BED_ADMIN_TOKEN  可选
# 注：本仓库不提交任何敏感信息或占位符，所有配置在面板填写，避免误泄露密钥。

# 保留错误日志，不记录含下载 token / Telegram Bot Token 的请求 URL。
# 在支持 URL 脱敏前不启用自动 traces。
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

# 定时清理过期 / 超额分享（Cron Trigger）
[triggers]
crons = ["0 4 * * *"]
